[project]
name = "mpc-mcp"
version = "0.1.0"
description = "Unofficial MCP server for Akai MPC hardware and software: MIDI control, recording, and project file tools."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3",
    "mido>=1.3",
    "python-rtmidi>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mpc-mcp = "mpc_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpc_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
